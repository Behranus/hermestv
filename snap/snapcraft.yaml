name: hermestv
version: '2.1.0'
title: HermesTV
summary: HermesTV — Free IPTV Player
description: |
  HermesTV is a free and open-source IPTV player for Android and Linux.
  
  Features:
  - M3U playlist and Xtream Codes IPTV support
  - 7,000+ free world TV channels via iptv-org
  - VOD — movies and TV series with poster art
  - EPG (Electronic Program Guide) support
  - Subtitle support — HLS embedded and external SRT/VTT/ASS
  - Audio track selection — multi-language audio
  - TV remote / D-pad navigation support
  - Zorin OS inspired dark theme
  
  Supports: TR / EN / KU languages

contact: https://github.com/Behranus/hermestv/issues
website: https://github.com/Behranus/hermestv
source-code: https://github.com/Behranus/hermestv
issues: https://github.com/Behranus/hermestv/issues

base: core22
confinement: strict
grade: stable
icon: flatpak/com.iptv.iptv_player.png
license: MIT

architectures:
  - build-on: amd64

apps:
  hermestv:
    command: usr/local/bin/hermestv
    plugs:
      - network
      - audio-playback
      - opengl
      - x11
      - wayland
    environment:
      LD_LIBRARY_PATH: $SNAP/usr/lib:$SNAP/usr/lib/x86_64-linux-gnu:$SNAP/lib:$SNAP/lib/x86_64-linux-gnu

parts:
  hermestv:
    plugin: dump
    source: build/linux/x64/release/bundle/
    build-packages:
      - libfontconfig1
      - libfribidi0
      - libgbm1
      - libgtk-3-0t64
      - libgdk-pixbuf-2.0-0
      - libgraphite2-3
      - libharfbuzz0b
      - libjpeg-turbo8
      - libmp3lame0
      - libmpg123-0t64
      - libogg0
      - libopus0
      - libpango-1.0-0
      - libpangocairo-1.0-0
      - libpangoft2-1.0-0
      - libpixman-1-0
      - libpulse0
      - libsndfile1
      - libthai0
      - libvorbis0a
      - libvorbisenc2
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libxcb-render0
      - libxcb-shm0
      - libxcb1
      - libxkbcommon0
    organize:
      hermestv: usr/local/bin/hermestv
      lib/*: usr/lib/
      data/*: usr/share/hermestv/
    stage:
      - usr/local/bin/hermestv
      - usr/lib/*
      - usr/share/hermestv/*
    override-prime: |
      craftctl default
      chmod +x usr/local/bin/hermestv

app-id: com.iptv.iptv_player
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: hermestv

finish-args:
  # Ağ erişimi — IPTV akışları için
  --share=network
  # GPU erişimi — video oynatma için
  --device=dri
  # Ses erişimi
  --socket=pulseaudio
  # Wayland + X11 fallback
  --socket=wayland
  --socket=fallback-x11
  --share=ipc
  # Bildirimler (opsiyonel)
  --talk-name=org.freedesktop.Notifications

modules:
  # ── Flutter SDK ──
  - name: flutter-sdk
    buildsystem: simple
    build-commands:
      - mkdir -p /app/flutter
      - cp -r flutter-sdk/* /app/flutter/
      - export PATH="/app/flutter/bin:$PATH"
      - flutter doctor
    sources:
      - type: archive
        url: https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.24.5-stable.tar.xz
        sha256: 831e87b27df782c2d20525c86d6381c124e8e98b38e7a4e990e4c3b15a3e3a3e

  # ── HermesTV ──
  - name: hermestv
    buildsystem: simple
    build-options:
      env:
        PUB_CACHE: /app/dart-pub-cache
    build-commands:
      - export PATH="/app/flutter/bin:$PATH"
      - flutter pub get
      - flutter build linux --release
      - cp -r build/linux/x64/release/bundle/* /app/
    sources:
      - type: dir
        path: ../../

  # ── Desktop dosyası ──
  - name: hermestv-desktop
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/applications
      - cp com.iptv.iptv_player.desktop /app/share/applications/
      - mkdir -p /app/share/icons/hicolor/256x256/apps
      - cp com.iptv.iptv_player.png /app/share/icons/hicolor/256x256/apps/
    sources:
      - type: dir
        path: flatpak/

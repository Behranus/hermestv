app-id: com.iptv.iptv_player
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: hermestv

# ─── GÜVENLİK: Minimum izinler ───
# Sadece IPTV oynatma için kesinlikle gerekli olan izinler.
# Mikrofon, kamera, konum, bildirim, tam ev erişimi YOK.
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=x11
  - --share=ipc
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-run/wayland-0

modules:
  - name: hermestv
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/lib /app/data
      - cp bundle/hermestv /app/hermestv
      - cp -r bundle/lib/* /app/lib/
      - cp -r bundle/data/* /app/data/
      # Wrapper script (heredoc ile)
      - "printf '#!/bin/sh\\nexport LD_LIBRARY_PATH=\"/app/lib:$LD_LIBRARY_PATH\"\\nif [ -n \"$WAYLAND_DISPLAY\" ]; then export GDK_BACKEND=wayland; fi\\nexec /app/hermestv \"$@\"\\n' > /app/bin/hermestv"
      - chmod +x /app/bin/hermestv
      - install -Dm644 desktop/com.iptv.iptv_player.desktop /app/share/applications/com.iptv.iptv_player.desktop
      - install -Dm644 desktop/com.iptv.iptv_player.metainfo.xml /app/share/metainfo/com.iptv.iptv_player.metainfo.xml
      - install -Dm644 desktop/com.iptv.iptv_player.png /app/share/icons/hicolor/256x256/apps/com.iptv.iptv_player.png
    sources:
      - type: dir
        path: ../build/linux/x64/release/bundle
        dest: bundle
      - type: dir
        path: .
        dest: desktop

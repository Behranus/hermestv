app-id: com.iptv.iptv_player
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: hermestv

finish-args:
  --share=network
  --device=dri
  --socket=pulseaudio
  --socket=alsa
  --socket=wayland
  --socket=fallback-x11
  --share=ipc
  --filesystem=home
  --talk-name=org.freedesktop.Notifications

modules:
  - name: hermestv
    buildsystem: simple
    build-commands:
      # Binary ve kütüphaneleri kur
      - mkdir -p /app/bin /app/lib /app/data
      - cp -r bundle/lib/* /app/lib/
      - cp -r bundle/data/* /app/data/
      - cp bundle/hermestv /app/lib/hermestv
      # Çalıştırma scripti
      - |
        cat > /app/bin/hermestv << 'EOF'
        #!/bin/sh
        export LD_LIBRARY_PATH="/app/lib:$LD_LIBRARY_PATH"
        exec /app/lib/hermestv "$@"
        EOF
      - chmod +x /app/bin/hermestv
      # Desktop + İkon + Metadata
      - install -Dm644 desktop/com.iptv.iptv_player.desktop /app/share/applications/com.iptv.iptv_player.desktop
      - install -Dm644 desktop/com.iptv.iptv_player.metainfo.xml /app/share/metainfo/com.iptv.iptv_player.metainfo.xml
      - install -Dm644 desktop/com.iptv.iptv_player.png /app/share/icons/hicolor/256x256/apps/com.iptv.iptv_player.png
    sources:
      # Hazır Linux build bundle'ı
      # KULLANIM: flatpak-builder'ı proje kökünden çalıştır:
      #   cd ~/Masaüstü/orhan
      #   flatpak-builder build-dir flatpak/com.iptv.iptv_player.yml
      - type: dir
        path: ../build/linux/x64/release/bundle
        dest: bundle
      # Desktop dosyaları
      - type: dir
        path: .
        dest: desktop
